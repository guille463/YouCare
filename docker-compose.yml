services:
  db:
    image: postgis/postgis:17-3.5
    container_name: youcare-db
    environment:
      POSTGRES_DB: youcare
      POSTGRES_USER: youcare
      POSTGRES_PASSWORD: youcare
    ports:
      - "5433:5432"
    volumes:
      - youcare-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youcare -d youcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: youcare-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  youcare-data: