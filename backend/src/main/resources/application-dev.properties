# ===== Desarrollo local (docker-compose) =====
# Credenciales del contenedor local: no dan acceso a nada fuera de tu ordenador

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/youcare
spring.datasource.username=youcare
spring.datasource.password=youcare

# Ver el SQL que genera Hibernate (solo para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Correo local (Mailpit: http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025