# Base de datos local (docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5433/youcare
spring.datasource.username=youcare
spring.datasource.password=youcare

# Hibernate solo valida; el esquema lo crea Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Correo local (Mailpit)
spring.mail.host=localhost
spring.mail.port=1025